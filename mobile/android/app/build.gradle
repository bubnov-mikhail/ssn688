apply plugin: 'com.android.application'

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.bubnov.ssn688"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    namespace 'com.bubnov.ssn688'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':ssn688lib')
    // Resolve duplicate Kotlin class issues with gomobile AARs.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.0")
}
